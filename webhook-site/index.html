<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщения на Supabase</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f5f5f7;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 24px 16px;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }
        h1 { font-size: 20px; margin-bottom: 16px; color: #1a1a1a; }
        textarea {
            width: 100%;
            min-height: 120px;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            font-size: 16px;
            resize: vertical;
        }
        textarea:focus { outline: none; border-color: #4a9eff; }
        button {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            background: #4a9eff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled { opacity: 0.5; cursor: wait; }
        .status { margin-top: 12px; font-size: 14px; color: #333; min-height: 20px; }
        .history { margin-top: 20px; max-height: 300px; overflow-y: auto; }
        .msg { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <!-- Форма входа -->
        <h1 id="title">Вход</h1>

        <!-- Форма авторизации -->
        <form id="loginForm" onsubmit="doLogin(event)">
            <input type="email" id="email" placeholder="Email" required style="width:100%; margin-bottom:8px; padding:12px; border:1px solid #ddd; border-radius:10px;">
            <input type="password" id="password" placeholder="Пароль" required style="width:100%; padding:12px; border:1px solid #ddd; border-radius:10px;">
            <button type="submit">Войти</button>
        </form>

        <!-- Форма отправки сообщения -->
        <div id="mainForm" style="display:none;">
            <textarea id="message" placeholder="Напишите сообщение..."></textarea>
            <button id="sendBtn" onclick="sendMessage()">Отправить</button>
            <div class="status" id="status"></div>

            <div class="history">
                <h3 style="font-size:14px; margin-bottom:8px;">Последние сообщения:</h3>
                <div id="historyList"></div>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ НАСТРОЙКИ SUPABASE — замените на свои!
        const URL = "https://<project-ref>.supabase.co";  // например: https://abc123.supabase.co
        const TABLE = "messages";                          // имя таблицы в Supabase

        async function doLogin(e) {
            e.preventDefault();
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                // Авторизация через Supabase Auth
                const response = await fetch(`${URL}/auth/v1/token`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });
                const data = await response.json();

                if (data.error) {
                    document.getElementById("status").textContent = `Ошибка входа: ${data.message || "Неверный email или пароль"}`;
                    return;
                }

                // Сохраняем токен и переходим к основному интерфейсу
                localStorage.setItem("sb-access-token", data.access_token);
                document.getElementById("loginForm").style.display = "none";
                document.getElementById("mainForm").style.display = "block";
            } catch (err) {
                document.getElementById("status").textContent = "Ошибка подключения. Проверьте настройки Supabase.";
            }
        }

        async function sendMessage() {
            const input = document.getElementById("message");
            const status = document.getElementById("status");
            const btn = document.getElementById("sendBtn");
            const text = input.value.trim();
            if (!text) {
                status.textContent = "Введите сообщение.";
                return;
            }

            btn.disabled = true;
            try {
                // Отправляем через REST API Supabase
                const response = await fetch(`${URL}/rest/v1/${TABLE}`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": "<API_KEY>",        // anon key из Supabase
                        "Authorization": `Bearer ${localStorage.getItem("sb-access-token")}` || ""
                    },
                    body: JSON.stringify({ message: text })
                });

                if (response.ok) {
                    status.textContent = "✅ Сообщение отправлено!";
                    input.value = "";
                    loadHistory();
                } else {
                    const error = await response.json().catch(() => null);
                    status.textContent = `Ошибка: ${error ? JSON.stringify(error).slice(0, 120) : "Неизвестная ошибка"}`;
                }
            } catch (err) {
                status.textContent = "Не удалось подключиться. Проверьте настройки Supabase.";
            } finally {
                btn.disabled = false;
            }
        }

        async function loadHistory() {
            try {
                const response = await fetch(`${URL}/rest/v1/${TABLE}?select=*,order=id.desc(limit=10)`, {
                    headers: { "apikey": "<API_KEY>" }
                });
                if (!response.ok) return;
                const data = await response.json();
                const list = document.getElementById("historyList");
                list.innerHTML = "";
                (data || []).forEach(msg => {
                    const div = document.createElement("div");
                    div.className = "msg";
                    div.textContent = `${msg.timestamp}: ${JSON.stringify(msg).slice(0, 120)}`;
                    list.appendChild(div);
                });
            } catch (err) {}
        }

        loadHistory();
    </script>
</body>
</html>
